; Keysmet ONE (KSM1)
;
; Examples are Arduino sketches under examples/<Name>/<Name>.ino — the same
; layout the Arduino IDE uses, so those files are the single source of
; truth. src/main.cpp picks one with a #include; uncomment the example you
; want there and build normally:
;
;     pio run -t upload

[env:ksm]
platform = nordicnrf52
board = ksm1
framework = arduino
board_build.variants_dir = variants
upload_protocol = nrfutil
; upload_protocol = jlink

monitor_speed = 115200
upload_speed = 115200

build_flags =
	-Wno-psabi
	-std=c++1z
	-std=gnu++1z
	-O2
	-Wno-maybe-uninitialized
	-Wno-unused-variable
	-I variants/ksm1

; TinyUSB declares SdFat as an optional dependency (for USB mass storage).
; We don't use MSC, and SdFat's SPI drivers don't build for this board, so
; keep it out of the dependency graph entirely.
lib_ignore = SdFat - Adafruit Fork

lib_deps =
	; NOTE: do NOT add "adafruit/Adafruit TinyUSB Library" here. The nRF52
	; core already bundles Adafruit_TinyUSB_Arduino, and pulling in the
	; standalone library too puts two copies of TinyUSB in the build. The
	; core's TinyUSB_Device_Init() then links against the wrong one, USB
	; never starts, and the board enumerates as nothing — no HID and no
	; serial port — even though the sketch itself runs fine.
	adafruit/Adafruit NeoPixel@1.11.0
	robtillaart/I2C_EEPROM@1.7.4
	fortyseveneffects/MIDI Library@5.0.2
